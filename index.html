<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CrispiCo | Order Online</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;justify-content:center}
    .wrap{width:100%;max-width:520px;padding:42px 22px;text-align:center}
    .logo{font-size:42px;font-weight:900;letter-spacing:-2px}
    .sub{margin:8px 0 30px;color:#bbb;font-size:15px}
  .logo-img{width:260px;max-width:80%;height:auto;display:block;margin:0 auto 10px}    
    .card{display:block;text-decoration:none;color:#fff;border:1px solid #333;border-radius:18px;padding:20px;margin:14px 0;background:#191919}
    .card:hover{background:#222}
    .name{font-size:20px;font-weight:800}
    .desc{font-size:13px;color:#aaa;margin-top:6px}
    .small{margin-top:30px;color:#777;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
  <img src="logo.png" class="logo-img" alt="Crispico">
    <div class="sub">One place. Three cravings.</div>

    <a class="card" href="https://ownly.food/app/brand/BR115540">
      <div class="name">🍔 Order from Bunly</div>
      <div class="desc">Burgers & more</div>
    </a>

    <a class="card" href="https://ownly.food/app/brand/BR114930">
      <div class="name">🧇 Order from Waffle Way</div>
      <div class="desc">Sweet cravings sorted</div>
    </a>

    <a class="card" href="https://ownly.food/app/brand/BR114929">
      <div class="name">🌯 Order from WrapMate</div>
      <div class="desc">Wrap your cravings</div>
    </a>

    <div class="small">Bunly • Waffle Way • WrapMate</div>
  </main>
</body>
</html>
